name: Go
on:
  pull_request:
    branches:
    - master
    - main
  push:
    branches:
    - master
    - main
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ 1.26.5 ]
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        check-latest: true
    - name: Check gofmt
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "not gofmt-clean:"
          echo "$unformatted"
          gofmt -d .
          exit 1
        fi
      shell: bash
    - name: Build
      run: go build ./...
      shell: bash
    - name: Vet
      run: go vet ./...
      shell: bash
    - name: Test
      run: go test -v ./...
      shell: bash
